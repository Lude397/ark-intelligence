<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Ark Intelligence</title>
    <link rel="icon" id="favicon" type="image/webp">
    <link rel="apple-touch-icon" id="appleTouchIcon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0f9f4;
            --bg-secondary: #e8f5e9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #c8e6c9;
            --border-focus: #66bb6a;
            --text-primary: #1b5e20;
            --text-secondary: #2e7d32;
            --text-muted: #66bb6a;
            --accent: #66bb6a;
            --accent-hover: #4caf50;
            --error: #d93025;
            --success: #1e8e3e;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(102, 187, 106, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(102, 187, 106, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container img {
            height: 48px;
            width: auto;
            margin-bottom: 8px;
        }

        .logo-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(46, 125, 50, 0.08);
            border: 1px solid var(--border-color);
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .name-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .name-field {
            flex: 1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.1);
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .phone-input {
            display: flex;
            gap: 10px;
        }

        .phone-prefix {
            flex-shrink: 0;
            width: 80px;
            padding: 14px 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            text-align: center;
            font-weight: 500;
        }

        .phone-input input {
            flex: 1;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            font-size: 18px;
        }

        .toggle-password:hover {
            color: var(--text-secondary);
        }

        .profile-section {
            margin-bottom: 24px;
        }

        .profile-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .profile-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-option {
            position: relative;
        }

        .profile-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .profile-card:hover {
            border-color: var(--text-secondary);
            background: var(--bg-card);
        }

        .profile-option input:checked + .profile-card {
            border-color: var(--accent);
            background: var(--bg-card);
        }

        .profile-radio {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .profile-option input:checked + .profile-card .profile-radio {
            border-color: var(--accent);
        }

        .profile-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.2s ease;
        }

        .profile-option input:checked + .profile-card .profile-radio::after {
            transform: scale(1);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .profile-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            display: none;
            color: var(--error);
            font-size: 12px;
            margin-top: 6px;
        }

        .form-group.error input,
        .name-field.error input {
            border-color: var(--error);
        }

        .form-group.error .error-message,
        .name-field.error .error-message {
            display: block;
        }

        .card-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .card-footer p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .card-footer a:hover {
            opacity: 0.8;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }

            .card-header h1 {
                font-size: 22px;
            }

            .name-row {
                flex-direction: column;
                gap: 0;
            }

            .name-field {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img class="app-logo" alt="Ark Intelligence">
            <p class="logo-subtitle">Assistant de cadrage projet</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h1>Créer votre compte</h1>
                <p>Accédez à vos outils de cadrage et structurez vos projets efficacement</p>
            </div>

            <form id="registerForm" autocomplete="off">
                <div class="name-row">
                    <div class="name-field">
                        <label>Prénom</label>
                        <div class="input-wrapper">
                            <input type="text" id="prenom" placeholder="Votre prénom" required>
                        </div>
                        <span class="error-message">Requis</span>
                    </div>

                    <div class="name-field">
                        <label>Nom</label>
                        <div class="input-wrapper">
                            <input type="text" id="nom" placeholder="Votre nom" required>
                        </div>
                        <span class="error-message">Requis</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Numéro de téléphone</label>
                    <div class="phone-input">
                        <div class="phone-prefix">+242</div>
                        <div class="input-wrapper">
                            <input type="tel" id="telephone" placeholder="06 XXX XXXX" required>
                        </div>
                    </div>
                    <span class="error-message">Veuillez entrer un numéro valide</span>
                </div>

                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" placeholder="Minimum 6 caractères" required>
                        <button type="button" class="toggle-password" id="togglePassword">👁</button>
                    </div>
                    <span class="error-message">Minimum 6 caractères requis</span>
                </div>

                <div class="profile-section">
                    <label class="profile-label">Votre profil</label>
                    <div class="profile-options">
                        <label class="profile-option">
                            <input type="radio" name="profil" value="projet" checked>
                            <div class="profile-card">
                                <div class="profile-radio"></div>
                                <div class="profile-info">
                                    <div class="profile-name">Porteur de projet</div>
                                    <div class="profile-desc">Accès aux documents essentiels</div>
                                </div>
                            </div>
                        </label>
                        <label class="profile-option">
                            <input type="radio" name="profil" value="Ark Operational Specialist">
                            <div class="profile-card">
                                <div class="profile-radio"></div>
                                <div class="profile-info">
                                    <div class="profile-name">Ark Operational Specialist</div>
                                    <div class="profile-desc">Accès complet à tous les outils</div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="codeArk Operational SpecialistGroup" style="display: none;">
                    <label>Code d'accès Ark Operational Specialist</label>
                    <div class="input-wrapper">
                        <input type="text" id="codeArk Operational Specialist" placeholder="Entrez votre code">
                    </div>
                    <span class="error-message">Code invalide</span>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    Créer mon compte
                </button>
            </form>

            <div class="card-footer">
                <p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
            </div>
        </div>
    </div>

        function applyLogo() {
            const favicon = document.getElementById('favicon');
            const appleTouchIcon = document.getElementById('appleTouchIcon');
            
            if (favicon) favicon.href = LOGO_BASE64;
            if (appleTouchIcon) appleTouchIcon.href = LOGO_BASE64;
            document.querySelectorAll('.app-logo').forEach(img => img.src = LOGO_BASE64);
        }

        // ========================================
        // CONFIGURATION SUPABASE
        // ========================================
        const SUPABASE_URL = 'https://ehaxnltgapcfxhwpqhyb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVoYXhubHRnYXBjZnhod3BxaHliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNDg1NjksImV4cCI6MjA4MjkyNDU2OX0.-XLe5c2sgzGxv9Olc13Lu3S0hTHjSbs2brbvVC556Ec';
        
        const arkSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========================================
        // INITIALISATION
        // ========================================
        document.addEventListener('DOMContentLoaded', function() {
            applyLogo();
        });

        // ========================================
        // ÉLÉMENTS DOM
        // ========================================
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        // ========================================
        // GESTION FORMULAIRE
        // ========================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset errors
            document.querySelectorAll('.form-group, .name-field').forEach(g => g.classList.remove('error'));
            
            const prenom = document.getElementById('prenom').value.trim();
            const nom = document.getElementById('nom').value.trim();
            const telephone = '+242' + document.getElementById('telephone').value.replace(/\s/g, '');
            const password = document.getElementById('password').value;
            const profil = document.querySelector('input[name="profil"]:checked').value;

            // Validation
            let hasError = false;

            if (!prenom) {
                document.getElementById('prenom').closest('.name-field').classList.add('error');
                hasError = true;
            }

            if (!nom) {
                document.getElementById('nom').closest('.name-field').classList.add('error');
                hasError = true;
            }

            if (!telephone || telephone.replace('+242', '').length !== 9) {
                document.getElementById('telephone').closest('.form-group').classList.add('error');
                hasError = true;
            }

            if (!password || password.length < 6) {
                document.getElementById('password').closest('.form-group').classList.add('error');
                hasError = true;
            }

            if (hasError) return;

            // Submit
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"><span class="spinner"></span> Création en cours...</span>';

            try {
                // Si Ark Operational Specialist, vérifier le code
                if (profil === 'Ark Operational Specialist') {
                    const codeValue = document.getElementById('codeArk Operational Specialist').value.trim();
                    
                    if (!codeValue) {
                        document.getElementById('codeArk Operational SpecialistGroup').classList.add('error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Créer mon compte';
                        return;
                    }

                    // Vérifier le code dans Supabase
                    const { data: codeData, error: codeError } = await arkSupabase
                        .from('ark_codes')
                        .select('*')
                        .eq('code', codeValue)
                        .eq('active', true)
                        .eq('utilise', false)
                        .single();

                    if (codeError || !codeData) {
                        document.getElementById('codeArk Operational SpecialistGroup').classList.add('error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = 'Créer mon compte';
                        return;
                    }
                }

                // Hasher le mot de passe
                const salt = await dcodeIO.bcrypt.genSalt(10);
                const hash = await dcodeIO.bcrypt.hash(password, salt);

                // Créer l'utilisateur avec prénom ET nom
                const { data, error } = await arkSupabase
                    .from('ark_users')
                    .insert([{
                        prenom: prenom,
                        nom: nom,
                        telephone: telephone,
                        password_hash: hash,
                        type_user: profil
                    }])
                    .select()
                    .single();

                if (error) throw error;

                // Si Ark Operational Specialist, marquer le code comme utilisé
                if (profil === 'Ark Operational Specialist') {
                    const codeValue = document.getElementById('codeArk Operational Specialist').value.trim();
                    await arkSupabase
                        .from('ark_codes')
                        .update({ utilise: true, utilise_par: data.id })
                        .eq('code', codeValue);
                }

                // Stocker l'utilisateur
                localStorage.setItem('ark_user', JSON.stringify({
                    id: data.id,
                    prenom: data.prenom,
                    nom: data.nom,
                    telephone: data.telephone,
                    type_user: data.type_user
                }));

                // Redirection
                window.location.href = 'index.html';

            } catch (error) {
                console.error('Erreur:', error);
                alert('Une erreur est survenue. Ce numéro existe peut-être déjà.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Créer mon compte';
            }
        });

        // ========================================
        // FORMATAGE TÉLÉPHONE
        // ========================================
        document.getElementById('telephone').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 9) value = value.slice(0, 9);
            
            if (value.length > 2) {
                value = value.slice(0, 2) + ' ' + value.slice(2);
            }
            if (value.length > 6) {
                value = value.slice(0, 6) + ' ' + value.slice(6);
            }
            
            e.target.value = value;
        });

        // ========================================
        // TOGGLE PASSWORD
        // ========================================
        document.getElementById('togglePassword').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            const btn = document.getElementById('togglePassword');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwd.type = 'password';
                btn.textContent = '👁';
            }
        });

        // ========================================
        // AFFICHER CHAMP CODE Ark Operational Specialist
        // ========================================
        document.querySelectorAll('input[name="profil"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const codeGroup = document.getElementById('codeArk Operational SpecialistGroup');
                codeGroup.style.display = e.target.value === 'Ark Operational Specialist' ? 'block' : 'none';
            });
        });
    </script>
</body>
