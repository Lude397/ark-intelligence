<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Parametres | Ark Intelligence</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/shared/css/sidebar.css">
    <link rel="stylesheet" href="/shared/css/responsive.css">
    <link rel="stylesheet" href="/parametres/parametres.css">
</head>
<body data-theme="light">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon"><img class="app-logo" alt="Ark"></div>
                    <div class="logo-text">Ark Intelligence</div>
                </div>
                <button class="home-btn" id="homeBtn" title="Accueil">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <div class="folder-item">
                        <div class="folder-header"><span>Ark Project</span></div>
                        <div class="folder-content">
                            <div class="doc-item" data-doc="definition_projet">
                                <div class="doc-left"><span class="icon">&#8226;</span><span>Definition de projet</span></div>
                            </div>
                            <div class="doc-item disabled" data-doc="orientation_solution">
                                <div class="doc-left"><span class="icon">&#8226;</span><span>Orientation de solution</span></div>
                                <span class="badge-soon">Bientot</span>
                            </div>
                            <div class="doc-item disabled" data-doc="formulation_solution">
                                <div class="doc-left"><span class="icon">&#8226;</span><span>Formulation de solution</span></div>
                                <span class="badge-soon">Bientot</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="sidebar-section">
                    <div class="folder-item">
                        <div class="folder-header"><span>Ark Business</span></div>
                        <div class="folder-content">
                            <div class="doc-item disabled" data-doc="design_thinking"><div class="doc-left"><span class="icon">&#8226;</span><span>Design Thinking</span></div><span class="badge-soon">Bientot</span></div>
                            <div class="doc-item disabled" data-doc="business_model"><div class="doc-left"><span class="icon">&#8226;</span><span>Business Model Canvas</span></div><span class="badge-soon">Bientot</span></div>
                            <div class="doc-item disabled" data-doc="lean_startup"><div class="doc-left"><span class="icon">&#8226;</span><span>Lean Start Up</span></div><span class="badge-soon">Bientot</span></div>
                            <div class="doc-item disabled" data-doc="agile"><div class="doc-left"><span class="icon">&#8226;</span><span>Agile</span></div><span class="badge-soon">Bientot</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="my-docs-btn-sidebar" id="myDocsBtnSidebar"><span>Mes documents</span></button>
                <button class="settings-btn" id="settingsBtn"><span>Parametres</span></button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="settings-page">
                <div class="settings-header">
                    <button class="hamburger-btn" id="hamburgerBtnSettings">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="settings-header-logo"><img class="app-logo" alt="Ark"></div>
                    <div class="settings-header-title">Parametres</div>
                </div>

                <div class="settings-content">
                    <div class="settings-card">
                        <div class="settings-section">
                            <div class="settings-section-title">Profil</div>
                            <div class="profile-form">
                                <div class="profile-avatar-container">
                                    <div class="profile-avatar" id="profileAvatar"></div>
                                </div>
                                <div class="profile-fields">
                                    <div class="form-group">
                                        <label for="profilePrenomInput">Prenom</label>
                                        <input type="text" id="profilePrenomInput" placeholder="Votre prenom">
                                    </div>
                                    <div class="form-group">
                                        <label for="profileNomInput">Nom</label>
                                        <input type="text" id="profileNomInput" placeholder="Votre nom">
                                    </div>
                                    <div class="form-group">
                                        <label for="profilePhoneInput">Telephone</label>
                                        <input type="tel" id="profilePhoneInput" placeholder="Votre telephone">
                                    </div>
                                    <div class="form-group">
                                        <label for="profileEmailInput">Email</label>
                                        <input type="email" id="profileEmailInput" placeholder="Votre email">
                                    </div>
                                    <div class="form-group">
                                        <label>Type de compte</label>
                                        <div class="profile-type" id="profileType">Porteur de projet</div>
                                    </div>
                                    <button class="save-profile-btn" id="saveProfileBtn">Enregistrer</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="settings-section">
                            <div class="settings-section-title">Theme</div>
                            <div class="theme-toggle">
                                <button class="theme-icon-btn" data-theme="dark" title="Sombre"><span style="display:block;width:20px;height:20px;background:#1a1a1a;border-radius:4px;"></span></button>
                                <button class="theme-icon-btn" data-theme="light" title="Clair"><span style="display:block;width:20px;height:20px;background:#f5f5f5;border:1px solid #ccc;border-radius:4px;"></span></button>
                                <button class="theme-icon-btn active" data-theme="vert" title="Vert menthe"><span style="display:block;width:20px;height:20px;background:#66bb6a;border-radius:4px;"></span></button>
                                <button class="theme-icon-btn" data-theme="bleu" title="Bleu ciel"><span style="display:block;width:20px;height:20px;background:#64b5f6;border-radius:4px;"></span></button>
                            </div>
                        </div>

                        <div class="settings-footer-btns">
                            <button class="logout-btn" id="logoutBtn">Deconnexion</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/shared/js/config.js"></script>
    <script src="/shared/js/auth.js"></script>
    <script src="/shared/js/theme.js"></script>
    <script src="/shared/js/sidebar.js"></script>
    <script src="/parametres/parametres.js"></script>
</body>
</html>
