<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orientation de solution | Ark Intelligence</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/shared/css/sidebar.css">
    <link rel="stylesheet" href="/shared/css/responsive.css">
    <link rel="stylesheet" href="/orientation/orientation.css">
</head>
<body data-theme="vert">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-icon"><img class="app-logo" alt="Ark"></div>
                    <div class="logo-text">Ark Intelligence</div>
                </div>
                <button class="home-btn" id="homeBtn" title="Accueil">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <div class="folder-item">
                        <div class="folder-header"><span>Ark Project</span></div>
                        <div class="folder-content">
                            <div class="doc-item" data-doc="definition_projet"><div class="doc-left"><span class="icon">&#8226;</span><span>Definition de projet</span></div></div>
                            <div class="doc-item active" data-doc="orientation_solution"><div class="doc-left"><span class="icon">&#8226;</span><span>Orientation de solution</span></div></div>
                            <div class="doc-item disabled" data-doc="formulation_solution"><div class="doc-left"><span class="icon">&#8226;</span><span>Formulation de solution</span></div><span class="badge-soon">Bientot</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="my-docs-btn-sidebar" id="myDocsBtnSidebar"><span>Mes documents</span></button>
                <button class="settings-btn" id="settingsBtn"><span>Parametres</span></button>
            </div>
        </aside>
        <main class="main-content">
            <div class="coming-soon-page">
                <div class="coming-soon-header">
                    <button class="hamburger-btn" id="hamburgerBtnOrientation"><span></span><span></span><span></span></button>
                    <div class="coming-soon-header-logo"><img class="app-logo" alt="Ark"></div>
                    <div class="coming-soon-title">Orientation de solution</div>
                </div>
                <div class="coming-soon-content">
                    <div class="coming-soon-icon"><img class="app-logo" alt="Ark"></div>
                    <h2>Bientot disponible</h2>
                    <p>Cette fonctionnalite est en cours de developpement.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="/shared/js/config.js"></script>
    <script src="/shared/js/auth.js"></script>
    <script src="/shared/js/theme.js"></script>
    <script src="/shared/js/sidebar.js"></script>
    <script src="/orientation/orientation.js"></script>
</body>
</html>
