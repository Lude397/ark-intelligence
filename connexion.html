<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Ark Intelligence</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" id="appleTouchIcon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0f4f9;
            --bg-secondary: #e8edf2;
            --bg-card: #ffffff;
            --bg-input: #f8f9fb;
            --border-color: #d1d5db;
            --border-focus: #6b7280;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --accent: #4b5563;
            --accent-hover: #374151;
            --error: #d93025;
            --success: #1e8e3e;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(107, 114, 128, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(107, 114, 128, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container img {
            height: 48px;
            width: auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.1);
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .phone-input {
            display: flex;
            gap: 10px;
        }

        .phone-prefix {
            flex-shrink: 0;
            width: 80px;
            padding: 14px 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            text-align: center;
            font-weight: 500;
        }

        .phone-input input {
            flex: 1;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-secondary);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .remember-me label {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(217, 48, 37, 0.1);
            color: var(--error);
            border: 1px solid rgba(217, 48, 37, 0.2);
        }

        .alert-success {
            background: rgba(30, 142, 62, 0.1);
            color: var(--success);
            border: 1px solid rgba(30, 142, 62, 0.2);
        }

        .card-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .card-footer p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .card-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .card-footer a:hover {
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }

            .card-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img class="app-logo" alt="Ark Intelligence">
        </div>

        <div class="card">
            <div class="card-header">
                <h1>Connexion</h1>
                <p>Accedez a votre espace Ark Intelligence</p>
            </div>

            <div id="alertError" class="alert alert-error"></div>
            <div id="alertSuccess" class="alert alert-success"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="telephone">Numero de telephone</label>
                    <div class="phone-input">
                        <div class="phone-prefix">+242</div>
                        <div class="input-wrapper">
                            <input 
                                type="tel" 
                                id="telephone" 
                                name="telephone" 
                                placeholder="06 XXX XXXX"
                                required
                                autocomplete="tel"
                            >
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="input-wrapper password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Entrez votre mot de passe"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe" checked>
                    <label for="rememberMe">Se souvenir de moi</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Se connecter
                </button>
            </form>

            <div class="card-footer">
                <p>Pas encore de compte ? <a href="inscription.html">Creer un compte</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script>
        const LOGO_BASE64 = "COLLER_VOTRE_BASE64_ICI";

        function applyLogo() {
            const favicon = document.getElementById('favicon');
            const appleTouchIcon = document.getElementById('appleTouchIcon');
            
            if (favicon) favicon.href = LOGO_BASE64;
            if (appleTouchIcon) appleTouchIcon.href = LOGO_BASE64;
            document.querySelectorAll('.app-logo').forEach(img => img.src = LOGO_BASE64);
        }

        const SUPABASE_URL = 'https://ehaxnltgapcfxhwpqhyb.supabase.co';
        const SUPABASE_ANON_KEY = 'COLLER_VOTRE_BASE64_ICI';
        
        const arkSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', function() {
            applyLogo();
            
            const localUser = localStorage.getItem('ark_user');
            const sessionUser = sessionStorage.getItem('ark_user');
            
            if (localUser || sessionUser) {
                window.location.href = 'index.html';
            }
        });

        const loginForm = document.getElementById('loginForm');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const submitBtn = document.getElementById('submitBtn');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            alertError.classList.remove('show');
            alertSuccess.classList.remove('show');
            
            const telephone = '+242' + document.getElementById('telephone').value.replace(/\s/g, '');
            const password = document.getElementById('password').value;
            const rememberMe = rememberMeCheckbox.checked;

            if (telephone.replace('+242', '').length !== 9) {
                alertError.textContent = 'Le numero de telephone doit contenir 9 chiffres.';
                alertError.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Connexion en cours...</span>';

            try {
                const { data: user, error: fetchError } = await arkSupabase
                    .from('ark_users')
                    .select('id, nom, telephone, type_user, email, password_hash')
                    .eq('telephone', telephone)
                    .single();

                if (fetchError || !user) {
                    throw new Error('Numero de telephone ou mot de passe incorrect.');
                }

                const isValidPassword = await dcodeIO.bcrypt.compare(password, user.password_hash);

                if (!isValidPassword) {
                    throw new Error('Numero de telephone ou mot de passe incorrect.');
                }

                const userData = JSON.stringify({
                    id: user.id,
                    nom: user.nom,
                    telephone: user.telephone,
                    type_user: user.type_user,
                    email: user.email
                });

                if (rememberMe) {
                    localStorage.setItem('ark_user', userData);
                    sessionStorage.removeItem('ark_user');
                } else {
                    sessionStorage.setItem('ark_user', userData);
                    localStorage.removeItem('ark_user');
                }

                window.location.href = 'index.html';

            } catch (error) {
                alertError.textContent = error.message || 'Erreur de connexion. Veuillez reessayer.';
                alertError.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Se connecter';
            }
        });

        document.getElementById('telephone').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 9) value = value.slice(0, 9);
            
            if (value.length > 2) {
                value = value.slice(0, 2) + ' ' + value.slice(2);
            }
            if (value.length > 6) {
                value = value.slice(0, 6) + ' ' + value.slice(6);
            }
            
            e.target.value = value;
        });

        document.getElementById('togglePassword').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                pwd.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        });
    </script>
</body>
</html>
